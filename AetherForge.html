<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>STARK INDUSTRIES | CONSTRUCTOR V2.2</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; font-family: 'Segoe UI', sans-serif; }
        
        /* HUD UI */
        #hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 60%, #000 150%);
            pointer-events: none;
        }

        /* TOOLBAR */
        #toolbar {
            position: absolute; top: 50%; left: 20px; transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 10px; pointer-events: auto;
        }
        
        .tool-btn {
            background: rgba(0, 30, 30, 0.9); border: 1px solid #00aaaa; color: #00ffff;
            width: 60px; height: 60px; font-size: 24px; cursor: pointer;
            transition: 0.2s; display: flex; align-items: center; justify-content: center;
            border-radius: 10px; box-shadow: 0 0 10px rgba(0,255,255,0.1);
        }
        .tool-btn:hover { background: #00ffff; color: #000; box-shadow: 0 0 20px #00ffff; }
        .tool-btn.active-tool { background: #00ffff; color: black; box-shadow: 0 0 25px #00ffff; border-color: white; }

        /* PROPERTIES */
        #properties {
            position: absolute; top: 50%; right: 20px; transform: translateY(-50%);
            background: rgba(0, 20, 20, 0.9); padding: 20px; border-radius: 10px;
            border: 1px solid #005555; pointer-events: auto; display: none; width: 200px;
        }
        #properties.active { display: block; }
        
        label { color: #00aaaa; font-size: 12px; display: block; margin-top: 15px; }
        input[type="color"] { width: 100%; border: none; height: 40px; cursor: pointer; border-radius: 5px; }
        input[type="range"] { width: 100%; margin-top: 5px; accent-color: #00ffff; }
        
        .action-btn {
            background: transparent; border: 1px solid #00aaaa; color: #00ffff;
            padding: 10px; width: 100%; margin-top: 10px; font-family: 'Segoe UI'; 
            text-transform: uppercase; cursor: pointer; transition: 0.3s;
        }
        .action-btn:hover { background: #00ffff; color: black; }

        /* MODAL */
        #import-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 100;
            display: none; align-items: center; justify-content: center;
            pointer-events: auto;
        }
        .modal-content {
            background: rgba(0, 20, 20, 0.95); border: 2px solid #00ffff;
            padding: 30px; width: 400px; text-align: center;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.2); border-radius: 15px;
        }
        
        /* HEADER */
        #top-bar { position: absolute; top: 20px; width: 100%; text-align: center; pointer-events: none; }
        h1 { color: #00ffff; letter-spacing: 5px; font-size: 18px; text-shadow: 0 0 10px #00ffff; margin:0; }
        
        /* MULTI-SELECT BADGE */
        #multi-badge {
            display: none; background: #00ffff; color: black; font-size: 10px; padding: 2px 5px; border-radius: 3px; float: right;
        }

    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="hud"></div>
    <div id="top-bar">
        <h1>NEON CONSTRUCTOR V2.2</h1>
        <p style="color:#666; font-size:12px;">GROUP TRANSFORM MODULE ACTIVE</p>
    </div>

    <div id="toolbar">
        <button class="tool-btn" id="add-cube" title="Spawn Cube">🧊</button>
        <button class="tool-btn" id="add-sphere" title="Spawn Sphere">⚪</button>
        <button class="tool-btn" id="add-cyl" title="Spawn Cylinder">🛢️</button>
        <div style="height: 1px; background: #005555; margin: 10px 0;"></div>
        <button class="tool-btn active-tool" id="tool-move" title="Move (G)">✥</button>
        <button class="tool-btn" id="tool-rotate" title="Rotate (R)">↻</button>
        <button class="tool-btn" id="tool-scale" title="Scale (S)">⤢</button>
    </div>

    <div id="properties">
        <h3 style="color:#00ffff; margin:0; border-bottom:1px solid #005555; padding-bottom:10px;">
            DETAILS <span id="multi-badge">GROUP</span>
        </h3>
        <label>NEON COLOR</label>
        <input type="color" id="prop-color" value="#00ffff">
        <label>GLOW INTENSITY</label>
        <input type="range" id="prop-glow" min="0" max="2" step="0.1" value="1">
        <label>TRANSPARENCY</label>
        <input type="range" id="prop-opacity" min="0" max="1" step="0.1" value="0.8">
        <button class="action-btn" id="btn-delete" style="border-color: #ff3333; color: #ff3333;">DELETE</button>
    </div>

    <div style="position:absolute; bottom:20px; width:100%; text-align:center; pointer-events:auto; display:flex; gap:10px; justify-content:center;">
        <button class="action-btn" id="btn-open-import" style="width: auto; padding: 10px 40px; background: rgba(0,0,0,0.8);">📂 IMPORT OBJ</button>
        <button class="action-btn" id="btn-export" style="width: auto; padding: 10px 40px; background: rgba(0,0,0,0.8);">💾 SAVE BLUEPRINT</button>
    </div>

    <div id="import-modal">
        <div class="modal-content">
            <h2 style="color:#00ffff;">IMPORT DATA</h2>
            <p style="color:#00aaaa;">Select a <strong>.OBJ</strong> file.<br>Geometry will be added to the zone.</p>
            <input type="file" id="file-input" accept=".obj" style="display:none">
            <button class="action-btn" id="btn-browse" style="margin-bottom: 10px; background: #003333;">SELECT FILE</button>
            <button class="action-btn" id="btn-close-modal" style="border-color: #666; color:#999;">CANCEL</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';
        import { OBJExporter } from 'three/addons/exporters/OBJExporter.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

        // --- 1. SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);
        scene.fog = new THREE.FogExp2(0x000000, 0.03);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(8, 8, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ReinhardToneMapping;
        document.body.appendChild(renderer.domElement);

        const orbit = new OrbitControls(camera, renderer.domElement);
        orbit.enableDamping = true;

        const transform = new TransformControls(camera, renderer.domElement);
        transform.addEventListener('dragging-changed', (e) => orbit.enabled = !e.value);
        scene.add(transform);

        // --- 2. ENVIRONMENT ---
        const ambient = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambient);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);
        const grid = new THREE.GridHelper(20, 20, 0x004444, 0x001111);
        scene.add(grid);

        // --- 3. OBJECT MANAGEMENT ---
        const constructionZone = new THREE.Group();
        scene.add(constructionZone);

        // MULTI-SELECT LOGIC
        let selectedObjects = []; // Array to store multiple objects
        const selectionGroup = new THREE.Group(); // Temporary group for moving multiple items
        scene.add(selectionGroup); // Add to scene (not constructionZone) to avoid exporting the helper group itself

        function createMaterial(colorHex) {
            return new THREE.MeshStandardMaterial({
                color: colorHex,
                emissive: colorHex, 
                emissiveIntensity: 0.5,
                transparent: true,
                opacity: 0.8,
                metalness: 0.5,
                roughness: 0.1,
                side: THREE.DoubleSide
            });
        }

        function createObject(type) {
            let geometry;
            if(type === 'cube') geometry = new THREE.BoxGeometry(1, 1, 1);
            else if(type === 'sphere') geometry = new THREE.SphereGeometry(0.6, 32, 32);
            else if(type === 'cyl') geometry = new THREE.CylinderGeometry(0.5, 0.5, 1, 32);

            const mesh = new THREE.Mesh(geometry, createMaterial(0x00ffff));
            mesh.position.y = 0.5;
            constructionZone.add(mesh);
            
            // Auto select new object (clearing previous)
            updateSelection([mesh]);
        }

        // Core Selection Logic
        function updateSelection(newSelectionArray) {
            // 1. Detach Controls
            transform.detach();

            // 2. Ungroup old selection (if any exist in the group)
            // We iterate backwards because .attach() modifies the children array
            while(selectionGroup.children.length > 0) {
                const child = selectionGroup.children[0];
                constructionZone.attach(child); // Moves back to main zone, preserving World Transform
            }

            // 3. Update State
            selectedObjects = newSelectionArray;

            // 4. Handle UI
            const propPanel = document.getElementById('properties');
            const multiBadge = document.getElementById('multi-badge');

            if (selectedObjects.length === 0) {
                propPanel.classList.remove('active');
                return;
            }

            propPanel.classList.add('active');
            
            if (selectedObjects.length === 1) {
                // SINGLE MODE
                multiBadge.style.display = 'none';
                const mesh = selectedObjects[0];
                transform.attach(mesh);
                
                // Sync UI to single object
                document.getElementById('prop-color').value = '#' + mesh.material.color.getHexString();
                document.getElementById('prop-opacity').value = mesh.material.opacity;
                document.getElementById('prop-glow').value = mesh.material.emissiveIntensity;

            } else {
                // MULTI MODE
                multiBadge.style.display = 'inline-block';
                
                // Calculate Center of Selection
                const box = new THREE.Box3();
                selectedObjects.forEach(obj => box.expandByObject(obj));
                const center = box.getCenter(new THREE.Vector3());

                // Position the helper group at center
                selectionGroup.position.copy(center);
                selectionGroup.rotation.set(0,0,0);
                selectionGroup.scale.set(1,1,1);

                // Attach objects to helper group
                selectedObjects.forEach(obj => {
                    selectionGroup.attach(obj); 
                });

                // Attach controls to the group
                transform.attach(selectionGroup);
            }
        }

        // --- 4. EXPORT / IMPORT LOGIC ---
        
        document.getElementById('btn-export').onclick = () => {
            // Before exporting, ensure everything is back in the constructionZone
            // (The updateSelection call with empty array forces ungrouping)
            const currentSelection = [...selectedObjects];
            updateSelection([]); 
            
            const exporter = new OBJExporter();
            const result = exporter.parse(constructionZone);
            const blob = new Blob([result], { type: 'text/plain' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'jarvis_structure.obj';
            link.click();

            // Restore selection after export
            updateSelection(currentSelection);
        };

        const modal = document.getElementById('import-modal');
        const fileInput = document.getElementById('file-input');
        document.getElementById('btn-open-import').onclick = () => modal.style.display = 'flex';
        document.getElementById('btn-close-modal').onclick = () => { modal.style.display = 'none'; fileInput.value = ''; };
        document.getElementById('btn-browse').onclick = () => fileInput.click();

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const contents = event.target.result;
                const loader = new OBJLoader();
                const loadedGroup = loader.parse(contents);

                const newMeshes = [];
                while(loadedGroup.children.length > 0) {
                    const child = loadedGroup.children[0];
                    if (child.isMesh) {
                        child.material = createMaterial(0x00ffff);
                        constructionZone.add(child);
                        newMeshes.push(child);
                    } else {
                        constructionZone.add(child);
                    }
                }
                
                // Select imported items
                if(newMeshes.length > 0) updateSelection(newMeshes);

                modal.style.display = 'none';
                fileInput.value = '';
            };
            reader.readAsText(file);
        });

        // --- 5. UI & CONTROLS ---
        function setActiveTool(mode, btnId) {
            transform.setMode(mode);
            ['tool-move', 'tool-rotate', 'tool-scale'].forEach(id => document.getElementById(id).classList.remove('active-tool'));
            document.getElementById(btnId).classList.add('active-tool');
        }

        document.getElementById('tool-move').onclick = () => setActiveTool('translate', 'tool-move');
        document.getElementById('tool-rotate').onclick = () => setActiveTool('rotate', 'tool-rotate');
        document.getElementById('tool-scale').onclick = () => setActiveTool('scale', 'tool-scale');

        window.addEventListener('keydown', (e) => {
            if(e.key === 'g') setActiveTool('translate', 'tool-move');
            if(e.key === 'r') setActiveTool('rotate', 'tool-rotate');
            if(e.key === 's') setActiveTool('scale', 'tool-scale');
            if(e.key === 'Delete') document.getElementById('btn-delete').click();
        });

        // BATCH PROPERTY UPDATES
        document.getElementById('prop-color').oninput = (e) => {
            const col = new THREE.Color(e.target.value);
            selectedObjects.forEach(obj => {
                if(obj.material) {
                    obj.material.color.set(col);
                    obj.material.emissive.set(col);
                }
            });
        };
        document.getElementById('prop-glow').oninput = (e) => {
            const val = parseFloat(e.target.value);
            selectedObjects.forEach(obj => {
                if(obj.material) obj.material.emissiveIntensity = val;
            });
        };
        document.getElementById('prop-opacity').oninput = (e) => {
            const val = parseFloat(e.target.value);
            selectedObjects.forEach(obj => {
                if(obj.material) obj.material.opacity = val;
            });
        };

        document.getElementById('add-cube').onclick = () => createObject('cube');
        document.getElementById('add-sphere').onclick = () => createObject('sphere');
        document.getElementById('add-cyl').onclick = () => createObject('cyl');

        // BATCH DELETE
        document.getElementById('btn-delete').onclick = () => {
            if(selectedObjects.length > 0) {
                // Detach controls first
                transform.detach();
                
                // Remove objects from hierarchy
                selectedObjects.forEach(obj => {
                   obj.parent.remove(obj); 
                });
                
                // Clear selection
                updateSelection([]);
            }
        };

        // --- 6. RAYCASTING (SHIFT SELECT) ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        
        window.addEventListener('pointerdown', (e) => {
            if(e.target.closest('button') || e.target.closest('input') || e.target.closest('#properties') || e.target.closest('#import-modal')) return;
            
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            
            // Raycast against everything in constructionZone
            // Note: If objects are currently in selectionGroup, we must check that too!
            // Easiest way: Check both constructionZone and selectionGroup
            const objectsToCheck = [...constructionZone.children, ...selectionGroup.children];
            const intersects = raycaster.intersectObjects(objectsToCheck, true);

            if(intersects.length > 0) {
                // Find the mesh
                let hitObj = intersects[0].object;
                
                // Determine logic based on Shift Key
                if (e.shiftKey) {
                    // TOGGLE SELECTION
                    const index = selectedObjects.indexOf(hitObj);
                    if (index > -1) {
                        // Deselect this one
                        const newSel = selectedObjects.filter(o => o !== hitObj);
                        updateSelection(newSel);
                    } else {
                        // Add this one
                        updateSelection([...selectedObjects, hitObj]);
                    }
                } else {
                    // SINGLE SELECTION (if not already selected)
                    // If we click an object that is part of a group but shift isn't held, we usually select just that one
                    if (!selectedObjects.includes(hitObj)) {
                         updateSelection([hitObj]);
                    }
                    // If it IS already selected and we are in group mode, we might want to keep the group 
                    // (But standard behavior is usually "click selects only this one" unless dragging)
                    // For simplicity: Click without shift = Select Only This.
                }

            } else {
                // Clicked Empty Space -> Deselect All
                updateSelection([]);
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            orbit.update();
            renderer.render(scene, camera);
        }
        animate();
        
        window.onresize = () => {
            camera.aspect = window.innerWidth/window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
